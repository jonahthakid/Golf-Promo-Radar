<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f0a;color:#c8c8c8;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#111;border:1px solid #1a2f1c;padding:40px;width:100%;max-width:360px}
h1{font-family:'Fjalla One',sans-serif;color:#00ff41;font-size:24px;letter-spacing:3px;margin-bottom:8px}
.sub{color:#555;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:32px}
input{width:100%;background:#0a0f0a;border:1px solid #1a2f1c;color:#00ff41;padding:12px 16px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:16px;outline:none}
input:focus{border-color:#00ff41}
button{width:100%;background:#00ff41;color:#000;border:none;padding:12px;font-family:'Fjalla One',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;text-transform:uppercase}
button:hover{background:#00cc33}
.error{color:#ff3333;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="login-box">
    <h1>RADAR</h1>
    <div class="sub">Admin Access</div>
    <div class="error" id="error">Invalid password</div>
    <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Authenticate</button>
</div>
<script>
async function login() {
    const pw = document.getElementById('password').value;
    const res = await fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw})
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/admin';
    } else {
        document.getElementById('error').style.display = 'block';
    }
}
</script>
</body>
</html>
